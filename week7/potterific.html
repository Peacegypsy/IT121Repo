<html>
<head>
    <script
            src="https://code.jquery.com/jquery-3.7.1.min.js"
            integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
            crossorigin="anonymous"></script>
</head>
<style>
    table, tr, td{
        border-spacing: 5px;
        padding: 5px;
        border: 1px solid white;
    }
    .odd {
        background-color: #96D4D4;
    }
</style>

<body>
<div id="buttons">
    <button onclick="showHouse(this.value)" value="Gryffindor">Gryffindor</button>
    <button onclick="showHouse(this.value)" value="Hufflepuff">Hufflepuff</button>
    <button onclick="showHouse(this.value)" value="Slytherin">Slytherin</button>
    <button onclick="showHouse(this.value)" value="Ravenclaw">Ravenclaw</button>
</div>

<table id="table">
    <tr id="tableHeader">
        <th scope="col">name</th>
        <th scope="col">role</th>
        <th scope="col">house</th>
        <th scope="col">gender</th>
        <th scope="col">alignment</th>
    </tr>
    <tbody id="tableBody">

    </tbody>
</table>
<button onclick="reset()">reset</button>
</body>

<script>
    // list of characters
    let characters = [
        {name:"Albus Dumbledore", role:"staff", house:"Gryffindor",gender:"m",alignment:"good"},
        {name:"Nymphadora Tonks", role:"", house:"Hufflepuff",gender:"f",alignment:"good"},
        {name:"Ron Weasley", role:"student", house:"Gryffindor",gender:"m",alignment:"good"},
        {name:"Ginny Weasley", role:"student", house:"Gryffindor",gender:"f",alignment:"good"},
        {name:"Hermione Granger", role:"student", house:"Gryffindor",gender:"f",alignment:"good"},
        {name:"Mad-eye Moody", role:"staff", house:"",gender:"m",alignment:"good"},
        {name:"Prof McGonagall", role:"staff", house:"Gryffindor",gender:"f",alignment:"good"},
        {name:"Harry Potter", role:"student", house:"Gryffindor",gender:"m",alignment:"good"},
        {name:"Draco Malfoy", role:"student", house:"Slytherin",gender:"m",alignment:"evil"},
        {name:"Hagrid", role:"staff", house:"Gryffindor",gender:"m",alignment:"good"},
        {name:"Luna Lovegood", role:"student", house:"Ravenclaw",gender:"f",alignment:"good"},
        {name:"Voldemort", role:"", house:"Slytherin",gender:"m",alignment:"evil"},
        {name:"Bellatrix Lestrange", role:"", house:"Slytherin",gender:"f",alignment:"evil"},
        {name:"Severus Snape", role:"staff", house:"Slytherin",gender:"m",alignment:"?"}
    ];

    let table = document.getElementById("tableBody");

    function showHouse(house) {
        var rows = $('tr');
        let houseName = house.toString();
        var gryff = rows.filter(`.${houseName}`).show();
        rows.not(gryff).hide();
        $("tr#tableHeader").show();
        updateRows();
    }

    function updateRows() {
        $("tr").removeClass("odd");
        $("tr:visible:odd").addClass("odd");
    }

    function reset() {
        table.replaceChildren("");
        characters.forEach(item => {
            const row = table.insertRow();
            row.className = item.house;
            updateRows();
            Object.values(item).forEach(value => {
                const cell = row.insertCell();
                cell.textContent = value;
            }
        )}
    )
    updateRows();
    }

    $(document).ready(function(){
        reset();
        console.log("Let's get sorting!");
    });

</script>
</html>
